name: Build 2024 AADT data

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/build_aadt_2024.py"
      - ".github/workflows/build-aadt-2024.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install data tools
        run: pip install pandas openpyxl requests

      - name: Build 2024 AADT GeoJSON
        run: python scripts/build_aadt_2024.py

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/aadt-2024.geojson data/aadt-2024-meta.json
          git diff --cached --quiet || git commit -m "Generate 2024 Caltrans AADT map data"
          git push
