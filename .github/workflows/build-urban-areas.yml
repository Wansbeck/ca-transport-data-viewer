name: Build urban areas

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/build_urban_areas.py"
      - ".github/workflows/build-urban-areas.yml"

permissions:
  contents: write

concurrency:
  group: urban-areas-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git pull --rebase origin main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/build_urban_areas.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add data/urban-areas-2020.geojson data/urban-areas-2020-meta.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh Census urban areas"
          git push origin HEAD:main
