name: Build traveller context

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/build_traveller_context_osm.py"
      - ".github/workflows/build-traveller-context.yml"
  schedule:
    - cron: "41 10 1 * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Build traveller context
        run: python scripts/build_traveller_context_osm.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/traveller-context-osm.geojson data/traveller-context-osm-meta.json
          if git diff --cached --quiet; then
            echo "No traveller context changes."
          else
            git commit -m "Refresh traveller context data"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
