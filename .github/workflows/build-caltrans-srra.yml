name: Build Caltrans SRRA

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/build_caltrans_srra.py"
      - ".github/workflows/build-caltrans-srra.yml"
  schedule:
    - cron: "15 11 1 * *"

permissions:
  contents: write

concurrency:
  group: caltrans-srra-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git pull --rebase origin main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/build_caltrans_srra.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/caltrans-srra.geojson data/caltrans-srra-meta.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh Caltrans safety rest areas"
          git push origin HEAD:main
