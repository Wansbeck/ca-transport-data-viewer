name: Build lightweight opportunity layer

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/build_opportunity_lite.py"
      - ".github/workflows/build-opportunity-lite.yml"
      - "data/opportunity-2024.geojson"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install geopandas
      - name: Build lightweight display layer
        run: python scripts/build_opportunity_lite.py
      - name: Commit lightweight layer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/opportunity-2024-lite.geojson data/opportunity-2024-lite-meta.json
          git diff --cached --quiet || git commit -m "Generate lightweight opportunity layer"
          git pull --rebase origin main
          git push origin HEAD:main
