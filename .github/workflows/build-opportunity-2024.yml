name: Build opportunity score

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build service competition data", "Build traveller context", "Build urban areas", "Build Caltrans SRRA"]
    types: [completed]
  push:
    paths:
      - "scripts/build_opportunity_2024.py"
      - ".github/workflows/build-opportunity-2024.yml"
      - "data/aadt-2024-segments.geojson"
      - "data/truck-2024.geojson"
      - "data/acs-2024-tract-context.geojson"
      - "data/services-osm.geojson"
      - "data/traveller-context-osm.geojson"
      - "data/urban-areas-2020.geojson"
      - "data/caltrans-srra.geojson"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: git pull --rebase origin main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install geopandas scipy
      - name: Build opportunity layer
        run: |
          if [ ! -f data/services-osm.geojson ] || [ ! -f data/traveller-context-osm.geojson ] || [ ! -f data/urban-areas-2020.geojson ] || [ ! -f data/caltrans-srra.geojson ]; then
            echo "Required upstream datasets are not available yet."
            exit 0
          fi
          python scripts/build_opportunity_2024.py
      - name: Commit opportunity data
        run: |
          if [ ! -f data/opportunity-2024.geojson ] || [ ! -f data/opportunity-2024-meta.json ]; then
            echo "No opportunity output generated on this run."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add data/opportunity-2024.geojson data/opportunity-2024-meta.json
          if git diff --cached --quiet; then
            echo "No opportunity data changes to commit."
          else
            git commit -m "Refresh corridor opportunity scores"
            git push origin HEAD:main
          fi
