name: Build 2024 traffic segments

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/build_aadt_segments.py"
      - "data/aadt-2024.geojson"
      - ".github/workflows/build-aadt-segments.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install geometry tools
        run: pip install requests shapely

      - name: Build derived highway traffic segments
        run: python scripts/build_aadt_segments.py

      - name: Commit generated segment data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/aadt-2024-segments.geojson data/aadt-2024-segments-meta.json
          git diff --cached --quiet || git commit -m "Generate derived 2024 traffic segments"
          git push
